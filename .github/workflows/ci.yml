name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: API (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/OrderShieldPro.sln

      - name: Build
        run: dotnet build src/OrderShieldPro.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/OrderShieldPro.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  frontend:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ordershieldpro-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ordershieldpro-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      # Karma needs a browser; ChromeHeadless is preinstalled on ubuntu-latest runners.
      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless
